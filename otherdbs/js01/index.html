<!DOCTYPE html>
<html>

<head>
    <title>iBoxDB JavaScript Embedded NoSQL Database online</title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta name="description" content="JavaScript Embedded NoSQL Database,iBoxDB online." />
    <meta name="keywords" content="iBoxDB,NoSQL,JavaScript" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="./common.js"></script>
    <script type="text/javascript">
        var main = null;
        var test2 = null;
        var test3 = null;
        var run_script = null;
    </script>
    <script type="module">
        import { main as _main } from './teavm/classes.js';
        main = _main;
    </script>
    <script type="module">
        import { test2 as _test2, test_db_online, help } from './test_iboxdb.js';
        import { test3 as _test3 } from './test_iboxdb_opfs.js';
        test2 = () => _test2();
        test3 = () => _test3().then(() => true);
        run_script = function () {
            let o = test_db_online(txtjs.value);
            txtout.value = json_string(o);
        }
        setTimeout(
            () => {
                txtout.value = help();
            }
            , 500);
    </script>
</head>

<body onload="main()">

    <div id="jsdiv" style="display: grid">
        <textarea id="txtjs" rows="20" spellcheck="false" autocomplete="off">
let js = new JsBox();          
let cfg = js.get_config();
cfg.ensure_table({"id":BigInt(0)}, "table", "id");
js.open();
let obj = {};
//Begin Write Code Here
obj.value = Date.now();
obj.items = [ {"item_id":33n}, {"item_id":66n,"pro":true} ];
//End
obj.id = js.new_id();
js.insert("table",obj);
js.select("from table limit 0, 10" );  
            </textarea>
        <button onclick="run_script()">Run Script</button>
        <textarea id="txtout" rows="20" spellcheck="false" autocomplete="off">

            </textarea>
    </div>
</body>

</html>
